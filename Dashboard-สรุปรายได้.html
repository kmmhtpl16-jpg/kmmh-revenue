<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard สรุปรายได้ — กิจมั่งมีโฮม</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{ color-scheme:light; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#f4f4f5; color:#1c1917; font-family:"Sarabun","Segoe UI",system-ui,sans-serif; padding:24px 16px 60px; }
  .wrap{ max-width:1000px; margin:0 auto; }
  h1{ font-size:23px; } .lead{ color:#57534e; font-size:14px; margin:6px 0 16px; }
  .bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  input[type=month]{ border:1.5px solid #d6d3d1; border-radius:8px; padding:7px 10px; font:inherit; }
  .btn{ background:#16a34a; color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; font-weight:700; cursor:pointer; }
  .cards{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .kpi{ flex:1; min-width:180px; background:#fff; border:1px solid #e7e5e4; border-radius:12px; padding:14px 16px; }
  .kpi .l{ color:#78716c; font-size:13px; } .kpi .v{ font-size:24px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .s{ font-size:12px; color:#a8a29e; margin-top:2px; }
  .card{ background:#fff; border:1px solid #e7e5e4; border-radius:12px; padding:18px; margin-bottom:14px; }
  .card h2{ font-size:17px; margin-bottom:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:right; padding:7px 9px; border-bottom:1px solid #f0efed; }
  th:first-child,td:first-child{ text-align:left; }
  th{ color:#57534e; font-weight:700; font-size:12.5px; background:#fafaf9; }
  .num{ font-variant-numeric:tabular-nums; }
  .flag{ background:#fef2f2; }
  .ok{ color:#15803d; } .warn{ color:#b91c1c; }
  .muted{ color:#78716c; font-size:13px; }
  .badge{ font-size:12px; font-weight:800; padding:2px 9px; border-radius:20px; background:#dcfce7; color:#15803d; }
  .badge.w{ background:#fef2f2; color:#b91c1c; }
  canvas{ max-height:240px; }
  .upk td{ border-bottom:1px solid #f5f5f4; }
  .upk input[type=number]{ width:130px; text-align:right; border:1.5px solid #d6d3d1; border-radius:8px; padding:6px 9px; font:inherit; }
  #upkBox input[type=text]{ width:100%; border:1.5px solid #e7e5e4; border-radius:8px; padding:6px 9px; font:inherit; font-size:13px; }
  .hint{ font-size:11.5px; color:#a8a29e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Dashboard สรุปรายได้ — กิจมั่งมีโฮม</h1>
  <div class="lead">ดึงสดจาก Supabase · วันที่แสดงเป็น พ.ศ. · เลือกเดือนเพื่อดูสรุป</div>
  <div style="margin-bottom:14px"><a href="สารบัญ-รายได้.html" style="display:inline-block;background:#fefce8;color:#a16207;border:1.5px solid #ca8a04;border-radius:8px;padding:8px 14px;text-decoration:none;font-weight:700">🔎 สารบัญ →</a> <a href="index.html" style="display:inline-block;background:#f0fdf4;color:#15803d;border:1.5px solid #16a34a;border-radius:8px;padding:8px 14px;text-decoration:none;font-weight:700;margin-left:6px">🧮 ตรวจรายได้ →</a> <a href="ลูกหนี้ลงบัญชี.html" style="display:inline-block;background:#fef2f2;color:#b91c1c;border:1.5px solid #ef4444;border-radius:8px;padding:8px 14px;text-decoration:none;font-weight:700;margin-left:6px">📒 ลูกหนี้ →</a> <a href="การเงินบริษัท.html" style="display:inline-block;background:#eef2ff;color:#3730a3;border:1.5px solid #4f46e5;border-radius:8px;padding:8px 14px;text-decoration:none;font-weight:700;margin-left:6px">💼 การเงินบริษัท →</a></div>
  <div class="bar">
    <label>เดือน: <input type="month" id="month"></label>
    <button class="btn" onclick="load()">↻ โหลดใหม่</button>
    <span class="muted" id="status"></span>
  </div>

  <div class="cards" id="kpis"></div>
  <div id="upkBox"></div>
  <div class="cards" id="kpis2"></div>

  <div class="card"><h2>📈 ยอด K+ (QR) รายวัน</h2><canvas id="chart"></canvas></div>

  <div class="card"><h2>📋 ผลตรวจรายวัน (ที่ยืนยันแล้ว)</h2><div id="auditTbl" class="muted">—</div></div>

  <div class="cards">
    <div class="card" style="flex:1;min-width:300px"><h2>📌 มัดจำคงค้าง</h2><div id="depTbl" class="muted">—</div></div>
    <div class="card" style="flex:1;min-width:300px"><h2>💸 เงินรอจับคู่</h2><div id="pendTbl" class="muted">—</div></div>
  </div>
</div>

<script>
// ---- ล็อกรหัส (เฉพาะคุณหลิง) — เปลี่ยนรหัสที่ตัวแปร PIN ----
const PIN="0402";
(function gate(){
  if(sessionStorage.getItem("rev_dash_ok")==="1") return;
  const p=prompt("🔒 ใส่รหัสผ่านเพื่อดู Dashboard สรุปรายได้:");
  if(p===PIN){ sessionStorage.setItem("rev_dash_ok","1"); return; }
  document.documentElement.innerHTML='<body style="font-family:Sarabun,system-ui,sans-serif;text-align:center;padding:80px 20px;color:#1c1917"><div style="font-size:40px">🔒</div><div style="font-size:18px;margin-top:10px">รหัสไม่ถูกต้อง — เฉพาะผู้มีสิทธิ์เท่านั้น</div><button onclick="location.reload()" style="margin-top:18px;padding:9px 18px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-weight:700;cursor:pointer">ลองใหม่</button></body>';
  throw new Error("locked");
})();

const SB_URL="https://hfystbdqjhftrlelmkjm.supabase.co";
const SB_KEY="sb_publishable_Cz_p8O1rAs2ohPDtnKS_BA_LYUGiw8r";
const sb = window.supabase.createClient(SB_URL, SB_KEY,{auth:{storageKey:"sb-rev-kmmh",persistSession:true,autoRefreshToken:true}});
// บัตรผ่านจริง: ใช้ session ที่ล็อกอินจากหน้าหลักไว้ (เก็บใน localStorage โดเมนเดียวกัน) หรือมินต์ใหม่จาก PIN
const LOGIN_FN_URL = SB_URL + "/functions/v1/login";
async function ensureRevSession(pin){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) return true;
    const resp = await fetch(LOGIN_FN_URL, { method:"POST", headers:{ "apikey":SB_KEY, "Content-Type":"application/json" }, body: JSON.stringify({ pin }) });
    const j = await resp.json();
    if(resp.ok && j.access_token){ await sb.auth.setSession({ access_token:j.access_token, refresh_token:j.refresh_token }); return true; }
  }catch(e){ console.error("ensureRevSession failed", e); }
  return false;
}
const TH = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const TH0 = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("th-TH",{maximumFractionDigits:0});
const beDate = s => { if(!s) return "—"; const p=String(s).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+(parseInt(p[0])+543); };
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mEnd=m=>{ const y=+m.slice(0,4), mo=+m.slice(5,7); return m+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0"); };
let chart=null, UPK=null, UPKM=null;

async function load(){
  const st=document.getElementById("status"); st.textContent="กำลังโหลด…";
  const msel=document.getElementById("month").value; // YYYY-MM
  const mFrom=(msel||"")+"-01", mTo=msel?mEnd(msel):"9999-12-31";
  const [a,d,dep,pend,cb,cp,fee,upk]=await Promise.all([
    sb.from("rev_audit").select("*").order("date"),
    sb.from("rev_daily").select("*").order("date"),
    sb.from("rev_deposits").select("*").eq("status","open").order("received_date"),
    sb.from("rev_pending").select("*").eq("status","open").order("date"),
    sb.from("rev_credit_bills").select("bill_date,total_amount,source").gte("bill_date",mFrom).lte("bill_date",mTo),
    sb.from("rev_credit_payments").select("pay_date,amount,method").gte("pay_date",mFrom).lte("pay_date",mTo),
    sb.from("rev_expenses").select("exp_date,amount,category").gte("exp_date",mFrom).lte("exp_date",mTo).ilike("category","%Shopee%"),
    sb.from("rev_monthly_upk").select("*").eq("month",msel||"-"),
  ]);
  if(a.error||d.error){ st.textContent="โหลดไม่ได้: "+((a.error||d.error).message); return; }
  st.textContent="";
  const inM = s => !msel || String(s).slice(0,7)===msel;
  const audit=(a.data||[]).filter(x=>inM(x.date));
  const daily=(d.data||[]).filter(x=>inM(x.date));
  const deps=dep.data||[], pends=pend.data||[];

  // KPIs
  const N=v=>{ const n=parseFloat(v); return isNaN(n)?0:n; };
  const auditedRev=audit.reduce((s,x)=>s+N(x.machine_net),0);
  const kplusMonth=daily.reduce((s,x)=>s+N(x.kplus_total),0);
  const depRemain=deps.reduce((s,x)=>s+(N(x.amount)-N(x.used_amount)),0);
  const pendSum=pends.reduce((s,x)=>s+N(x.amount),0);

  /* ---- แยกยอดขายตามช่องทาง (นับเฉพาะวันที่ยืนยันแล้ว ให้ตรงกับยอดรวมด้านบน) ---- */
  const okDays=audit.filter(x=>x.status==="ตรวจแล้ว");
  const okSet=new Set(okDays.map(x=>x.date));
  const revOk=okDays.reduce((s,x)=>s+N(x.machine_net),0);
  const upkBill=okDays.reduce((s,x)=>s+N(x.form_upk),0);
  const bills=(cb&&cb.data)?cb.data:[];
  const inOk=r=>okSet.has(String(r.bill_date).slice(0,10));
  const sumB=(f,only)=>bills.filter(r=>r.source===f&&(only?inOk(r):!inOk(r))).reduce((s,r)=>s+N(r.total_amount),0);
  const cntB=(f,only)=>bills.filter(r=>r.source===f&&(only?inOk(r):!inOk(r))).length;
  const crForm=sumB("auto-form",true), crShop=sumB("shopee-sync",true);
  const crFormOut=sumB("auto-form",false), crShopOut=sumB("shopee-sync",false);
  const walkin=revOk-crForm-crShop-upkBill;
  const pct=v=>revOk>0?(v/revOk*100).toFixed(1)+"% ของยอดขาย":"";
  /* ---- เงินเข้าตัดหนี้บิลเก่า ---- */
  const pays=(cp&&cp.data)?cp.data:[];
  const isShopeePay=r=>String(r.method||"").indexOf("Shopee")>=0;
  const isDepPay=r=>String(r.method||"")==="หักมัดจำ";
  const custPaid=pays.filter(r=>!isShopeePay(r)&&!isDepPay(r)).reduce((s,r)=>s+N(r.amount),0);
  const custPaidN=pays.filter(r=>!isShopeePay(r)&&!isDepPay(r)).length;
  const shopPaid=pays.filter(isShopeePay).reduce((s,r)=>s+N(r.amount),0);
  const depPaid=pays.filter(isDepPay).reduce((s,r)=>s+N(r.amount),0);
  /* ---- ค่าธรรมเนียม Shopee ที่ถูกหักจริงในเดือนนี้ ---- */
  const shopFee=((fee&&fee.data)?fee.data:[]).reduce((s,r)=>s+N(r.amount),0);

  document.getElementById("kpis").innerHTML=
    kpi("💰 รายได้ที่ตรวจแล้ว (เดือนนี้)", TH(auditedRev), okDays.length+" วันที่ยืนยัน · แยกตามช่องทางด้านขวา")+
    kpi("🏪 ขายหน้าร้าน (รับเงินทันที)", TH(walkin), "เงินสด + K+ + โอน · "+pct(walkin))+
    kpi("🧾 ลงบัญชี/เชื่อ (เดือนนี้)", TH(crForm), cntB("auto-form",true)+" ใบ · ไม่รวม Shopee · "+pct(crForm)+(crFormOut?" · +"+TH0(crFormOut)+" ในวันที่ยังไม่ยืนยัน":""))+
    kpi("🛒 Shopee (เดือนนี้)", TH(crShop), cntB("shopee-sync",true)+" ใบ · "+pct(crShop)+" · ค่าธรรมเนียมถูกหัก "+TH0(shopFee)+(crShopOut?" · +"+TH0(crShopOut)+" ในวันที่ยังไม่ยืนยัน":""))+
    kpi("💵 ลูกค้าโอนจ่ายบิลเก่า", TH(custPaid), custPaidN+" รายการ · ไม่ใช่ยอดขาย (เก็บหนี้)"+(shopPaid?" · Shopee โอนเข้า "+TH0(shopPaid):"")+(depPaid?" · หักมัดจำ "+TH0(depPaid):""));

  UPKM=msel; UPK=((upk&&upk.data)?upk.data:[])[0]||null;
  renderUpk(upkBill, okDays.length);

  document.getElementById("kpis2").innerHTML=
    kpi("ยอด K+ สะสม (เดือนนี้)", TH(kplusMonth), daily.length+" วันมีข้อมูล")+
    kpi("มัดจำคงค้าง", TH(depRemain), deps.length+" ใบ")+
    kpi("เงินรอจับคู่", TH(pendSum), pends.length+" รายการ");

  // Chart
  const labels=daily.map(x=>beDate(x.date)), vals=daily.map(x=>parseFloat(x.kplus_total)||0);
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("chart"),{type:"bar",
    data:{labels,datasets:[{label:"ยอด K+ (บาท)",data:vals,backgroundColor:"#60a5fa"}]},
    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>v.toLocaleString()}}}}});

  // Audit table
  document.getElementById("auditTbl").innerHTML = audit.length ? (
    '<table><thead><tr><th>วันที่</th><th>ยอดขายเครื่อง</th><th>ยอดฟอร์ม</th><th>ใบลดหนี้</th><th>K+</th><th>ฝากบัญชี</th><th>สถานะ</th></tr></thead><tbody>'+
    audit.map(x=>{ const cn=parseFloat(x.cn_total)||0; return '<tr class="'+(cn>0?'flag':'')+'"><td>'+beDate(x.date)+'</td><td class="num">'+TH(x.machine_net)+'</td><td class="num">'+TH(x.form_main)+'</td><td class="num">'+(cn>0?'<span class="warn">'+TH(cn)+'</span>':'—')+'</td><td class="num">'+TH(x.kplus_today)+'</td><td class="num">'+TH(x.bank_dep_today)+'</td><td><span class="badge">'+(x.status||'ตรวจแล้ว')+'</span></td></tr>'; }).join("")+
    '</tbody></table>') : '<div class="muted">ยังไม่มีผลตรวจที่ยืนยันในเดือนนี้ — กด "ยืนยัน & บันทึกผลตรวจ" ในโปรแกรมตรวจ</div>';

  // Deposits
  document.getElementById("depTbl").innerHTML = deps.length ? (
    '<table><thead><tr><th>วันที่รับ</th><th>เลขที่</th><th>ลูกค้า</th><th>เหลือ</th></tr></thead><tbody>'+
    deps.map(x=>{ const rem=(parseFloat(x.amount)||0)-(parseFloat(x.used_amount)||0); return '<tr><td>'+beDate(x.received_date)+'</td><td>'+(x.deposit_no||'—')+'</td><td>'+(x.customer||'—')+'</td><td class="num"><b>'+TH(rem)+'</b></td></tr>'; }).join("")+
    '<tr class="tot"><td colspan="3"><b>รวม</b></td><td class="num"><b>'+TH(depRemain)+'</b></td></tr></tbody></table>') : '<div class="muted">ไม่มีมัดจำค้าง 👍</div>';

  // Pending
  document.getElementById("pendTbl").innerHTML = pends.length ? (
    '<table><thead><tr><th>วันที่</th><th>เข้าทาง</th><th>ใครโอน</th><th>ยอด</th></tr></thead><tbody>'+
    pends.map(x=>'<tr><td>'+beDate(x.date)+'</td><td>'+(x.source||'—')+'</td><td>'+(x.from_name||'—')+'</td><td class="num">'+TH(x.amount)+'</td></tr>').join("")+
    '<tr class="tot"><td colspan="3"><b>รวม</b></td><td class="num"><b>'+TH(pendSum)+'</b></td></tr></tbody></table>') : '<div class="muted">ไม่มีเงินรอจับคู่ 👍</div>';
}
function kpi(l,v,s){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>'; }

/* ================= 🪵 UPK: ยอดเปิดบิล vs ยอดจ่ายจริง ================= */
function upkNums(billed){
  const w=UPK?(parseFloat(UPK.wood_amt)||0):0, h=UPK?(parseFloat(UPK.hato_amt)||0):0;
  const paid=w+h, diff=billed-paid;
  return {w,h,paid,diff};
}
function renderUpk(billed, days){
  const box=document.getElementById("upkBox");
  const {w,h,paid,diff}=upkNums(billed);
  const has=(UPK&&(UPK.wood_amt!=null||UPK.hato_amt!=null))?true:false;
  box.innerHTML='<div class="card"><h2>🪵 UPK เดือนนี้ — ยอดเปิดบิล เทียบ ยอดจ่ายจริง</h2>'+
  '<table class="upk"><tbody>'+
  '<tr><td>ยอดเปิดบิล <span class="hint">(ต้นทุน + กำไร · อัตโนมัติจากฟอร์ม '+days+' วัน)</span></td><td class="num" style="font-weight:800;font-size:17px">'+TH(billed)+'</td></tr>'+
  '<tr><td>บิลไม้ (จ่ายจริง) <span class="hint">อาจเป็นบิลเก่า 1–2 เดือนที่รับของเข้ามาแล้ว</span></td><td class="num"><input type="number" step="0.01" min="0" id="upk_wood" placeholder="กรอก" value="'+(has&&UPK.wood_amt!=null?UPK.wood_amt:"")+'" onchange="saveUpk()"></td></tr>'+
  '<tr><td>บิลสี HATO (จ่ายจริง) <span class="hint">ใช้เป้าที่ UPK ซื้อ</span></td><td class="num"><input type="number" step="0.01" min="0" id="upk_hato" placeholder="กรอก" value="'+(has&&UPK.hato_amt!=null?UPK.hato_amt:"")+'" onchange="saveUpk()"></td></tr>'+
  '<tr><td><b>รวมจ่ายจริง</b></td><td class="num" id="upkPaid" style="font-weight:800">'+(paid?TH(paid):"—")+'</td></tr>'+
  '<tr><td><b>ส่วนต่าง</b> <span class="hint">กำไรที่ลดให้ตอนสิ้นเดือน</span></td><td class="num" id="upkDiff" style="font-weight:800">'+(paid?'<span class="'+(diff>=0?"ok":"warn")+'">'+TH(diff)+(billed>0?' <span class="hint">('+(diff/billed*100).toFixed(1)+'% ของยอดเปิดบิล)</span>':'')+'</span>':"—")+'</td></tr>'+
  '</tbody></table>'+
  '<div style="margin-top:8px"><input type="text" id="upk_note" placeholder="โน้ต เช่น บิลไม้ก้อนนี้เป็นของเดือน ก.ค." value="'+esc(UPK&&UPK.note?UPK.note:"")+'" onchange="saveUpk()"></div>'+
  '<div class="hint" id="upkSaved" style="margin-top:6px">'+(UPK&&UPK.updated_at?"📌 บันทึกล่าสุด "+beDate(UPK.updated_at):"ยังไม่ได้กรอกยอดจ่ายจริงของเดือนนี้")+'</div>'+
  '<div class="hint" style="margin-top:4px">💡 ยอดเปิดบิลมาจากช่อง UPK ในฟอร์มรายวัน (นับเฉพาะวันที่ยืนยันแล้ว) · ยอดจ่ายจริง 2 ช่องนี้กรอกเอง เพราะสิ้นเดือนคิดกันเฉพาะต้นทุนสินค้าจริง</div>'+
  '</div>';
  box.dataset.billed=billed; box.dataset.days=days;
}
window.saveUpk=async function(){
  const box=document.getElementById("upkBox");
  const billed=parseFloat(box.dataset.billed)||0;
  const wEl=document.getElementById("upk_wood"), hEl=document.getElementById("upk_hato"), nEl=document.getElementById("upk_note");
  if(!UPKM||!sb) return;
  const row={month:UPKM, wood_amt:(String(wEl.value).trim()===""?0:Math.round(parseFloat(wEl.value)*100)/100),
             hato_amt:(String(hEl.value).trim()===""?0:Math.round(parseFloat(hEl.value)*100)/100),
             note:nEl.value||null, updated_by:"owner", updated_at:new Date().toISOString()};
  if(isNaN(row.wood_amt)||isNaN(row.hato_amt)){ alert("กรอกเป็นตัวเลขเท่านั้น"); return; }
  const {error}=await sb.from("rev_monthly_upk").upsert(row,{onConflict:"month"});
  if(error){ alert("บันทึกไม่สำเร็จ: "+error.message); return; }
  UPK=row;
  const {paid,diff}=upkNums(billed);
  document.getElementById("upkPaid").innerHTML=paid?TH(paid):"—";
  document.getElementById("upkDiff").innerHTML=paid?('<span class="'+(diff>=0?"ok":"warn")+'">'+TH(diff)+(billed>0?' <span class="hint">('+(diff/billed*100).toFixed(1)+'% ของยอดเปิดบิล)</span>':'')+'</span>'):"—";
  document.getElementById("upkSaved").textContent="✓ บันทึกแล้ว "+beDate(row.updated_at);
};

// default month = ล่าสุดที่มีข้อมูล
(async ()=>{
  if(!(await ensureRevSession(PIN))){ document.getElementById("status").textContent="เข้าสู่ระบบไม่สำเร็จ — รีเฟรชหน้าใหม่หรือเข้าผ่านหน้าโปรแกรมตรวจรายได้"; return; }
  const {data}=await sb.from("rev_daily").select("date").order("date",{ascending:false}).limit(1);
  const m=(data&&data[0])? String(data[0].date).slice(0,7) : new Date().toISOString().slice(0,7);
  document.getElementById("month").value=m;
  load();
})();
</script>
