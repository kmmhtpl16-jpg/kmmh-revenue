<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>HQ แชทกลุ่ม — กิจมั่งมีโฮม</title>
<meta name="theme-color" content="#132139">
<!-- ไอคอนหน้าโฮม iPhone "HQ แชท" (ต้องมีถึงจะเด้งเตือนได้) · แยกจากไอคอน HQ เดิม -->
<link rel="manifest" href="hq-chat.webmanifest">
<link rel="apple-touch-icon" href="hq-icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HQ แชท">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="revauth.js?v=2"></script>
<!-- HQ แชทกลุ่ม ขั้น ① (อ่านอย่างเดียว) · 27 ต.ค. 69
     - เจ้าของคนเดียว: ล็อกอินด้วย PIN ผ่าน RevAuth (Edge Function login) แล้วต้องได้บทบาท owner
     - ข้อมูลอยู่หลัง RLS is_owner() — ไม่ล็อกอินหรือไม่ใช่เจ้าของ ฐานข้อมูลไม่ส่งข้อความใดๆ มา
     - ไม่มีช่องพิมพ์ส่ง · ปักหมุด/โน๊ต/อัลบั้ม ยังปิด (ขั้น ②–④)
     เด้งเตือน (27 ต.ค.): ปุ่มกระดิ่ง → เปิด/ปิดเตือนเครื่องนี้ · service worker hq-sw.js scope "chat" (คุมแค่หน้านี้)
     ข้อความเตือนสร้างในฐาน ไม่มียอดเงิน · กุญแจ VAPID สาธารณะด้านล่าง (ส่วนลับอยู่ใน Supabase เท่านั้น)
     ขั้น ③ (28 ต.ค.): เจ้าของพิมพ์สั่งงาน + แท็ก @ / @all → ฟังก์ชัน hq_chat_send (ฐานตรวจเจ้าของเอง · ไม่เขียนตารางตรง)
     Claude ในคอมร้านตอบในชื่อผู้ช่วย · กดค้างที่ข้อความ = ยกเลิก (ก่อนผู้ช่วยหยิบ)
     ขั้น ④ (29 ต.ค.): พิมพ์ "ตัดบิล 28/10" → การ์ดยอด (hq_cut_preview) → ยืนยัน (hq_cut_request · ฐานตรวจเจ้าของ+ยอดซ้ำ)
     → ตัวเฝ้าในคอมร้านตัดเฉพาะบิลที่อนุมัติแล้ว (ไม่ใช้ AI) · กดค้างที่คำสั่ง = หยุดตัด (hq_cut_stop) -->
<style>
:root{
  --bg:#0F1A2E; --bar:#132139; --line:#22324F; --chip:#1C2B45; --bubble:#1C2B45; --day:#18263F;
  --ink:#EEF2F8; --muted:#A9B6CB; --dim:#8798B3; --amber:#F2A93B; --amber-ink:#1A1206; --err:#F28B82;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
a{color:var(--amber)}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 8px 10px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.hq{width:40px;height:40px;border-radius:12px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.ttl{display:flex;flex-direction:column;flex:1;min-width:0}
.ttl b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--muted)}
.ibtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer}
.ibtn:active{background:var(--chip)}
.tools{display:flex;gap:8px;padding:10px 12px;background:var(--bar)}
.tool{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--chip);border:none;font-size:13px;font-weight:500;opacity:.45;cursor:not-allowed;white-space:nowrap}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px}
.list>*{max-width:100%;min-width:0;flex-shrink:0}
.tool.on{opacity:1;cursor:pointer}
.pcount{color:var(--amber);font-weight:600}
.pinbar{display:flex;align-items:center;gap:10px;margin:0 12px 6px;padding:10px 12px;border-radius:12px;background:#2A2414;border:1px solid #5C4A1E;color:#F6E7C8;text-decoration:none;font-size:13px;line-height:1.4}
.pinbar span{flex:1}
.pinbar em{font-style:normal;font-size:12px;color:var(--amber);font-weight:600;white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.prow span{flex:1}
.prow em{font-style:normal;font-size:12px;color:var(--amber)}
.daysep{align-self:center;font-size:12px;color:var(--muted);background:var(--day);padding:3px 12px;border-radius:999px}
.msg{display:flex;gap:10px;align-items:flex-start;width:100%}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--amber);object-fit:cover;flex-shrink:0;background:var(--chip)}
.mcol{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mcol>*{max-width:100%;min-width:0}
.who{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.who b{font-size:14px;font-weight:600}
.who span{font-size:12px;color:var(--muted)}
.bub{background:var(--bubble);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bub b{font-weight:700;color:#fff}
.bub.clip{max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.more{align-self:flex-start;border:none;background:none;color:var(--amber);font-size:13px;font-weight:600;padding:4px 0;min-height:32px;cursor:pointer}
.meta{font-size:11px;color:var(--dim)}
.foot{display:flex;align-items:center;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line)}
.ro{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;padding:6px 14px;border-radius:22px;background:var(--chip);color:var(--muted);font-size:13px;line-height:1.4}
.soon{font-size:11px;color:var(--dim);text-align:center;padding:0 12px 8px;background:var(--bar)}
.empty,.note{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
.note.err{color:var(--err)}
/* ประตู PIN */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.gbox{width:100%;max-width:340px;background:var(--bar);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gbox h1{font-size:18px;margin:4px 0 0}
.gbox p{margin:0;font-size:13px;color:var(--muted);text-align:center}
.gbox input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;letter-spacing:8px;text-align:center;font-family:inherit}
.gbox input:focus{outline:2px solid var(--amber);outline-offset:1px}
.pbtn{width:100%;min-height:46px;border-radius:12px;border:none;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:15px;cursor:pointer}
.perr{min-height:18px;font-size:13px;color:var(--err);text-align:center}
.hide{display:none!important}
/* รายชื่อสมาชิก */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:15}
.sbox{width:100%;max-width:640px;max-height:80%;overflow-y:auto;background:var(--bar);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shead b{font-size:15px}
.mem{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:none}
.mem .av{width:40px;height:40px}
.mem div{display:flex;flex-direction:column}
.mem b{font-size:14px;font-weight:600}
.mem span{font-size:12px;color:var(--muted)}
.lnk{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;min-height:40px;cursor:pointer}
/* เด้งเตือน */
.ibtn .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.ibtn{position:relative}
.ntxt{font-size:13px;color:var(--muted);line-height:1.6;margin:4px 0 12px}
.ntxt b{color:var(--ink)}
.nbtn{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-weight:600;font-size:14px;margin-top:8px;cursor:pointer}
.nbtn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.nbtn:disabled{opacity:.5;cursor:default}
.nmsg{min-height:20px;font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.nmsg.err{color:var(--err)}
.dev{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;border-bottom:1px solid var(--line);font-size:13px}
.dev span{color:var(--muted)}
/* ขั้น ③ สั่งงาน: ข้อความเจ้าของ (ขวา สีอำพัน) + สถานะงาน · ช่องพิมพ์ + ป๊อปอัป "แท็กถึง" */
.me{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:100%}
.mebub{max-width:85%;background:var(--amber);color:var(--amber-ink);border-radius:16px 4px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mebub b{font-weight:700}
.mebub.cx{opacity:.55;text-decoration:line-through}
.me .meta{text-align:right}
.foot{position:relative;align-items:flex-end}
.foot textarea{flex:1;min-width:0;min-height:44px;max-height:132px;resize:none;border:1px solid #2E4166;border-radius:22px;background:var(--bg);color:var(--ink);padding:11px 16px;font-size:16px;line-height:1.35;font-family:inherit}
.foot textarea:focus{outline:2px solid var(--amber);outline-offset:0}
.send{width:44px;height:44px;border:none;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.ferr{font-size:12px;color:var(--err);padding:0 14px 6px;background:var(--bar);min-height:0}
.mention{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--day);border:1px solid #2E4166;border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.45);max-height:46vh;overflow-y:auto;z-index:5}
.mention>span{font-size:11px;color:var(--muted);padding:6px 10px 4px}
.mopt{min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 10px;border:none;border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.mopt.on,.mopt:active{background:#22324F}
.mopt .av{width:34px;height:34px}
.mopt .at{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.mopt div{display:flex;flex-direction:column}
.mopt b{font-size:14px;font-weight:600}
.mopt small{font-size:12px;color:var(--muted)}
/* ขั้น ④ การ์ดยืนยันตัดบิล */
.cutsum{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.cutsum b{font-size:16px}
.cutwarn{font-size:13px;color:var(--amber);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gbox">
    <div class="hq" aria-hidden="true">HQ</div>
    <h1>HQ แชทกลุ่ม</h1>
    <p id="gateMsg">สำหรับเจ้าของเท่านั้น · ใส่ PIN</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN" onkeydown="if(event.key==='Enter')submitPin()">
    <button class="pbtn" id="pinBtn" onclick="submitPin()">เข้าห้อง</button>
    <div class="perr" id="pinErr" role="alert"></div>
    <button class="lnk hide" id="gateOut" onclick="logout()">ออกจากระบบ / เปลี่ยนบัญชี</button>
  </div>
</div>

<div class="app" id="app" aria-hidden="true" inert>
  <div class="top">
    <div class="hq" aria-hidden="true">HQ</div>
    <div class="ttl"><b>KMMH COMMAND HQ</b><span id="sub">สมาชิก 8 คน + เจ้าของ</span></div>
    <button class="ibtn" aria-label="โหลดใหม่" onclick="load()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="ibtn" aria-label="การแจ้งเตือน" onclick="openNotify()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot hide" id="bellDot" aria-hidden="true"></span>
    </button>
    <button class="ibtn" aria-label="สมาชิกในห้อง" onclick="openMembers()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c2 .7 3 2.8 3 6"/></svg>
    </button>
  </div>
  <div class="tools" aria-label="เครื่องมือห้อง">
    <button class="tool on" id="pinBtn2" onclick="openPins()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4H6l4-4z"/></svg>ปักหมุด <b class="pcount" id="pinCount"></b></button>
    <button class="tool" disabled title="ขั้นต่อไป"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>โน๊ต</button>
    <button class="tool" disabled title="ขั้นต่อไป"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>อัลบั้ม</button>
  </div>
  <div class="soon">โน๊ต · อัลบั้ม เปิดใช้ในขั้นถัดไป</div>
  <a class="pinbar hide" id="pinbar" rel="noopener"></a>
  <div class="list" id="list" aria-live="polite"><div class="note">กำลังโหลด…</div></div>
  <div class="ferr hide" id="ferr" role="alert"></div>
  <div class="foot">
    <div class="mention hide" id="mention" role="listbox" aria-label="แท็กถึง"></div>
    <label for="msg" class="hide">พิมพ์ข้อความ</label>
    <textarea id="msg" rows="1" maxlength="2000" placeholder="พิมพ์ข้อความ หรือ @ เพื่อแท็ก" autocomplete="off" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" aria-label="ส่ง" onclick="sendMsg()" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<div class="sheet hide" id="act" onclick="if(event.target===this)closeAct()">
  <div class="sbox" role="dialog" aria-label="จัดการงาน">
    <div class="shead"><b>งานที่สั่ง</b><button class="ibtn" aria-label="ปิด" onclick="closeAct()">✕</button></div>
    <p class="ntxt" id="actTxt"></p>
    <button class="nbtn pri" id="actCancel">ยกเลิกงานนี้</button>
    <button class="nbtn" onclick="closeAct()">ไม่ยกเลิก</button>
    <div class="nmsg" id="actMsg" role="status"></div>
  </div>
</div>

<div class="sheet hide" id="cut" onclick="if(event.target===this)closeCut()">
  <div class="sbox" role="dialog" aria-label="ยืนยันตัดบิล">
    <div class="shead"><b>ตัดบิลใน ACC</b><button class="ibtn" aria-label="ปิด" onclick="closeCut()">✕</button></div>
    <div class="cutsum" id="cutSum">กำลังดูยอด…</div>
    <p class="cutwarn" id="cutWarn"></p>
    <button class="nbtn pri" id="cutOk" disabled>ยืนยันตัด</button>
    <button class="nbtn" onclick="closeCut()">ไม่ตัด</button>
    <div class="nmsg" id="cutMsg" role="status"></div>
  </div>
</div>

<div class="sheet hide" id="members" onclick="if(event.target===this)closeMembers()">
  <div class="sbox" role="dialog" aria-label="สมาชิกในห้อง">
    <div class="shead"><b>สมาชิก 8 คน + เจ้าของ</b><button class="ibtn" aria-label="ปิด" onclick="closeMembers()">✕</button></div>
    <div id="memList"></div>
    <div style="text-align:center;margin-top:8px"><button class="lnk" onclick="logout()">ออกจากระบบ</button></div>
  </div>
</div>

<div class="sheet hide" id="notify" onclick="if(event.target===this)closeNotify()">
  <div class="sbox" role="dialog" aria-label="การแจ้งเตือน">
    <div class="shead"><b>การแจ้งเตือน</b><button class="ibtn" aria-label="ปิด" onclick="closeNotify()">✕</button></div>
    <div id="nBody"></div>
    <div class="nmsg" id="nMsg" role="status"></div>
    <div id="nDevs"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- สมาชิก (ชื่อ/ตำแหน่ง/สีขอบ ตามใบงาน 27 ต.ค.) ---------- */
var MEMBERS={
  cos:   {name:"เลขา",    title:"หัวหน้าทีม / ผู้ประสานงาน", color:"#F2A93B"},
  corn:  {name:"ข้าวโพด", title:"ฝ่ายการเงิน",               color:"#F5D04C"},
  pak:   {name:"ผักชี",   title:"ฝ่ายจัดซื้อ/สต๊อก/วงกบ",    color:"#5BBF6A"},

var TZ="Asia/Bangkok";

function dayLabel(d){
  var k=dayKey(d), now=new Date(), today=dayKey(now), yest=dayKey(new Date(now.getTime()-864e5));
  if(k===today) return "วันนี้";

}

/* ข้อความแบบ Telegram HTML: ยอมแค่ <b> <i> · ที่เหลือเป็นตัวอักษรล้วน (สร้างด้วย textNode ไม่ใช้ innerHTML) */
function decodeEnt(s){ return s.replace(/&(lt|gt|quot|amp);/g,function(_m,e){ return {lt:"<",gt:">",quot:'"',amp:"&"}[e]; }); }
function fillBody(el,body,format){
  body=String(body==null?"":body);
  if(format!=="tg_html"){ el.textContent=body; return; }
  var re=/<(\/?)(b|i)>/g, stack=[el], last=0, m;
  function txt(s){ if(s) stack[stack.length-1].appendChild(document.createTextNode(decodeEnt(s))); }
  while((m=re.exec(body))){
    txt(body.slice(last,m.index)); last=re.lastIndex;
    if(!m[1]){ var n=document.createElement(m[2]); stack[stack.length-1].appendChild(n); stack.push(n); }
    else if(stack.length>1 && stack[stack.length-1].tagName.toLowerCase()===m[2]) stack.pop();
  }
  txt(body.slice(last));
}

var TASKS={};   /* message_id → {status, assignee} จากตาราง hq_chat_tasks (อ่านได้เฉพาะเจ้าของ) */
function tagNames(){ var a=["@all","@ทุกคน"]; Object.keys(MEMBERS).forEach(function(id){ a.push("@"+MEMBERS[id].name); }); return a; }
function fillMine(el,body){
  body=String(body==null?"":body);
  var names=tagNames().sort(function(a,b){ return b.length-a.length; }), i=0, last=0;
  while(i<body.length){
    var hit=null;
    if(body.charAt(i)==="@") for(var j=0;j<names.length;j++){ if(body.substr(i,names[j].length)===names[j]){ hit=names[j]; break; } }
    if(hit){
      if(i>last) el.appendChild(document.createTextNode(body.slice(last,i)));
      var b=document.createElement("b"); b.textContent=hit; el.appendChild(b);
      i+=hit.length; last=i;
    } else i++;
  }
  if(last<body.length) el.appendChild(document.createTextNode(body.slice(last)));
}

var LOADING=false;
/* ตรวจบทบาทจากฐานซ้ำก่อนโหลดทุกครั้ง (กลับเข้าแท็บ / ทุก 5 นาที / กดโหลดใหม่) — ถูกลดสิทธิ์หรือตัด session
   จะปิดหน้าข้อมูลในรอบตรวจถัดไป · ฐานข้อมูลปฏิเสธเองตั้งแต่คำขอแรกหลังตัด (r2 · Codex r1 #3, r2 #4) */
async function stillOwner(g){
  var r=null; try{ r=await RevAuth.currentRole(sb); }catch(e){}
  if(g!==undefined && g!==GEN) return false;   /* ผลตรวจรุ่นเก่า — ห้ามไปปิดประตูของรอบใหม่ (Codex ② r4) */
  if(r==="owner") return true;
  if(r) showGate("หน้านี้สำหรับเจ้าของเท่านั้น — บัญชีนี้เข้าไม่ได้",true); else showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่");
  return false;
}
async function load(){
  if(!READY || LOADING || !sb) return;
  LOADING=true;
  var g=GEN;
  try{
    if(!(await stillOwner(g)) || g!==GEN) return;
    /* ดึงรายงานใหม่เข้าห้อง (ฟังก์ชันฝั่งฐานตรวจว่าเป็นเจ้าของเอง) — พลาดก็ยังแสดงข้อความเดิม */
    var s=await sb.rpc("hq_chat_sync");
    if(g!==GEN) return;
    if(authErr(s.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
    /* ขั้น ③: คอมร้านปิดหลังส่งงาน → ตอบ "รับเรื่องแล้ว…" ให้งานที่ค้าง (พลาดก็ไม่เป็นไร) */
    try{ await sb.rpc("hq_chat_ack_stale"); }catch(_e){}
    if(g!==GEN) return;
    var q=await sb.from("hq_chat_messages")
      .select("id,sender,kind,body,body_format,posted_at")
      .eq("room","hq").order("posted_at",{ascending:false}).order("id",{ascending:false}).limit(60);
    if(!READY || g!==GEN) return;   /* ระหว่างรอ สิทธิ์หลุด/เข้าใหม่แล้ว — ไม่วาดผลรุ่นเก่า */
    if(authErr(q.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }   /* r2 (Codex ② r1 #2) */
    if(q.error){ $("list").innerHTML='<div class="note err">โหลดข้อความไม่ได้ ลองกดโหลดใหม่</div>'; return; }
    /* ขั้น ③ สถานะงานของข้อความเจ้าของ (พลาด = แสดง "ส่งแล้ว" ไปก่อน) */
    var mine=(q.data||[]).filter(function(r){ return r.sender==="owner"; }).map(function(r){ return r.id; });
    var tk={};
    if(mine.length){
      var tq=await sb.from("hq_chat_tasks").select("message_id,assignee,status").in("message_id",mine);
      if(!READY || g!==GEN) return;
      if(authErr(tq.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
      (tq.data||[]).forEach(function(t){ tk[t.message_id]={status:t.status,assignee:t.assignee}; });
    }
    /* ขั้น ④ สถานะคำสั่งตัดบิล (พลาด = แสดงแบบงานธรรมดาไปก่อน) */
    var ck={};
    if(mine.length){
      var cq=await sb.from("hq_cut_requests").select("id,message_id,status,stop_requested,n_cut,n_bills").in("message_id",mine);
      if(!READY || g!==GEN) return;
      if(authErr(cq.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
      (cq.data||[]).forEach(function(c){ ck[c.message_id]={id:c.id,status:c.status,stop:!!c.stop_requested,done:Number(c.n_cut)||0,total:Number(c.n_bills)||0}; });
    }
    TASKS=tk; CUTS=ck;
    render((q.data||[]).slice().reverse());
    await loadPins(g);
    schedFast(g);
  }catch(e){
    console.warn("hqchat.load",e);
    if(g===GEN && READY) $("list").innerHTML='<div class="note err">เชื่อมต่อไม่ได้ ลองกดโหลดใหม่</div>';
  }finally{ if(g===GEN) LOADING=false; }   /* คำขอรุ่นเก่าไม่ปลดล็อกของรอบใหม่ */
}

var SEND_CLIENT=null, SEND_FOR="", SENDING=false;
function fErr(t){ var e=$("ferr"); e.textContent=t||""; e.classList.toggle("hide",!t); }
function syncSend(){ $("sendBtn").disabled=SENDING || !READY || !$("msg").value.trim(); }
function growMsg(){ var t=$("msg"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight+2,132)+"px"; }
function uuid4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  var h=Array.prototype.map.call(b,function(x){ return (x+256).toString(16).slice(1); }).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
/* แท็กอ่านจากข้อความจริงตอนส่ง (ลบ @ชื่อ ทิ้ง = ไม่แท็กแล้ว) */
function mentionsOf(body){
  var m=[];
  if(body.indexOf("@all")>=0 || body.indexOf("@ทุกคน")>=0) m.push("all");
  Object.keys(MEMBERS).forEach(function(id){ if(body.indexOf("@"+MEMBERS[id].name)>=0) m.push(id); });
  return m;
}
var MQ=null, MSEL=0;   /* คำที่กำลังพิมพ์หลัง @ : {start,end,q} */
function mentionToken(){
  var t=$("msg"), pos=t.selectionStart, before=t.value.slice(0,pos), m=/(^|\s)@([^\s@]{0,12})$/.exec(before);
  return m ? {start:pos-m[2].length-1,end:pos,q:m[2]} : null;
}
function mentionOpts(q){
  var all=[{id:"all",name:"all",title:"ทุกคนในห้อง",ins:"@all"}];
  Object.keys(MEMBERS).forEach(function(id){ all.push({id:id,name:MEMBERS[id].name,title:MEMBERS[id].title,ins:"@"+MEMBERS[id].name}); });
  if(!q) return all;
  return all.filter(function(o){ return o.name.indexOf(q)===0 || o.id.indexOf(q.toLowerCase())===0 || (o.id==="all" && "ทุกคน".indexOf(q)===0); });
}
function hideMention(){ MQ=null; var b=$("mention"); b.classList.add("hide"); b.innerHTML=""; }
function showMention(){
  MQ=mentionToken(); var box=$("mention");
  var opts=MQ ? mentionOpts(MQ.q) : [];
  if(!opts.length){ hideMention(); return; }
  if(MSEL>=opts.length) MSEL=0;
  box.innerHTML=""; var h=document.createElement("span"); h.textContent="แท็กถึง"; box.appendChild(h);
  opts.forEach(function(o,i){
    var b=document.createElement("button"); b.type="button"; b.className="mopt"+(i===MSEL?" on":""); b.setAttribute("role","option");
    if(o.id==="all"){ var a=document.createElement("span"); a.className="at"; a.textContent="@"; a.setAttribute("aria-hidden","true"); b.appendChild(a); }
    else b.appendChild(avatar(o.id,MEMBERS[o.id]));
    var d=document.createElement("div"), n=document.createElement("b"), s=document.createElement("small");
    n.textContent=o.id==="all"?"@all":o.name; s.textContent=o.title; d.appendChild(n); d.appendChild(s); b.appendChild(d);
    b.addEventListener("mousedown",function(ev){ ev.preventDefault(); });   /* ไม่ให้คีย์บอร์ดหุบ */
    b.onclick=function(){ pickMention(o); };
    box.appendChild(b);
  });
  box.classList.remove("hide");
}
function pickMention(o){
  var t=$("msg"), k=MQ||mentionToken(); if(!k) return;
  t.value=t.value.slice(0,k.start)+o.ins+" "+t.value.slice(k.end);
  var p=k.start+o.ins.length+1; t.focus(); t.setSelectionRange(p,p);
  hideMention(); growMsg(); syncSend();
}
$("msg").addEventListener("input",function(){ MSEL=0; growMsg(); syncSend(); fErr(""); showMention(); });
$("msg").addEventListener("click",showMention);
$("msg").addEventListener("blur",function(){ setTimeout(hideMention,150); });
$("msg").addEventListener("keydown",function(ev){
  if(MQ && !$("mention").classList.contains("hide")){
    var n=mentionOpts(MQ.q).length;
    if(ev.key==="ArrowDown"){ ev.preventDefault(); MSEL=(MSEL+1)%n; showMention(); return; }
    if(ev.key==="ArrowUp"){ ev.preventDefault(); MSEL=(MSEL+n-1)%n; showMention(); return; }
    if(ev.key==="Enter"||ev.key==="Tab"){ ev.preventDefault(); pickMention(mentionOpts(MQ.q)[MSEL]); return; }
    if(ev.key==="Escape"){ hideMention(); return; }
  }
  /* คอม: Enter = ส่ง · Shift+Enter = ขึ้นบรรทัด · มือถือกดปุ่มส่งเอง (Enter ขึ้นบรรทัด) */
  if(ev.key==="Enter" && !ev.shiftKey && !ev.isComposing && !isIOS() && !/Android/.test(navigator.userAgent)){ ev.preventDefault(); sendMsg(); }
});
async function sendMsg(){
  if(SENDING || !READY || !sb) return;
  var body=$("msg").value.trim(); if(!body) return;
  if(body.length>2000){ fErr("ข้อความยาวเกิน 2000 ตัวอักษร"); return; }
  /* ขั้น ④ "ตัดบิล 28/10" → การ์ดยืนยัน (ไม่ส่งเป็นงานให้ผู้ช่วย) · พิมพ์ผิดรูปวันที่ = บอกทันที */
  var cd=parseCut(body);
  if(cd===false){ fErr("วันที่ไม่ถูกต้อง — พิมพ์แบบ ตัดบิล 28/10"); return; }
  if(cd){ openCut(cd); return; }
  /* uuid ต่อ 1 ข้อความ: กดส่งซ้ำ/เน็ตหลุดแล้วลองใหม่ = งานเดิม ไม่ซ้ำ · แก้ข้อความ = uuid ใหม่ */
  if(!SEND_CLIENT || SEND_FOR!==body){ SEND_CLIENT=uuid4(); SEND_FOR=body; }
  var g=GEN; SENDING=true; $("msg").readOnly=true; syncSend(); fErr(""); hideMention();   /* r2 (Codex r1 #10): ล็อกช่องพิมพ์ระหว่างส่ง */
  try{
    var r=await sb.rpc("hq_chat_send",{p_body:body,p_mentions:mentionsOf(body),p_client:SEND_CLIENT});
    if(g!==GEN) return;
    if(authErr(r.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
    if(r.error){ fErr(r.error.code==="P0001" ? String(r.error.message||"").replace(/^hq_chat:\s*/,"") : "ส่งไม่สำเร็จ ลองกดส่งอีกครั้ง"); return; }
    $("msg").value=""; SEND_CLIENT=null; SEND_FOR=""; growMsg();
    await load();
  }catch(e){ console.warn("send",e); if(g===GEN) fErr("เชื่อมต่อไม่ได้ ลองกดส่งอีกครั้ง (ไม่ส่งซ้ำ)"); }
  finally{ SENDING=false; $("msg").readOnly=false; syncSend(); }
}

/* ---------- ขั้น ④ สั่งตัดบิล: หน้าเว็บจับคำเอง (ไม่ใช้ AI) → ดูยอดจากฐาน → เจ้าของกดยืนยัน → ฐานตรวจสิทธิ์+ยอดซ้ำ → คอมร้านตัด ---------- */
/* คืน "YYYY-MM-DD" · false = เป็นคำสั่งตัดแต่วันที่ผิด · null = ไม่ใช่คำสั่งตัด
   รับ: [@ข้าวโพด] ตัดบิล [วันที่] 28/10[/69|/2569|/2026] [ตอนนี้|เลย|ทันที|ด้วย|ค่ะ|ครับ|นะ] */
var CUT_RE=/^(?:@ข้าวโพด\s*)?ตัดบิล\s*(?:วันที่\s*)?(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{4}|\d{2}))?(?:\s*(?:ตอนนี้|เลย|ทันที|ด้วย|ค่ะ|คะ|ครับ|นะ))*\s*$/;
function bkkToday(){ return dayKey(new Date()); }
function parseCut(body){
  var m=CUT_RE.exec(String(body||"").trim()); if(!m) return null;
  var d=+m[1], mo=+m[2], y, t=bkkToday(), ty=+t.slice(0,4);
  if(m[3]){ y=+m[3]; if(m[3].length===2) y=2500+y-543; else if(y>2400) y-=543; }
  else y=ty;
  function iso(yy){ return yy+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
  var s=iso(y);
  if(!m[3] && s>t) s=iso(y-1);   /* ไม่ใส่ปี + วันที่ยังไม่ถึง = ปีที่แล้ว */
  var x=new Date(s+"T00:00:00Z");
  if(mo<1||mo>12||d<1||isNaN(x.getTime())||x.getUTCDate()!==d||x.getUTCMonth()+1!==mo) return false;
  return s;
}
var CUT=null;   /* การ์ดที่เปิดอยู่: {date, n, amount, client, g} */
function bahtFmt(v){ return Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function closeCut(){ $("cut").classList.add("hide"); CUT=null; }
async function openCut(date){

  $("cutSum").textContent="กำลังดูยอด…"; $("cutWarn").textContent=""; $("cutMsg").textContent="";
  $("cutOk").disabled=true; $("cutOk").onclick=confirmCut; $("cut").classList.remove("hide"); hideMention();
  try{
    var r=await sb.rpc("hq_cut_preview",{p_date:date});
    if(g!==GEN || !CUT || CUT.date!==date) return;
    if(authErr(r.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
    if(r.error){ $("cutSum").textContent=r.error.code==="P0001" ? String(r.error.message||"").replace(/^hq_cut:\s*/,"") : "ดูยอดไม่ได้ ลองใหม่"; return; }
    var p=r.data||{}; CUT.n=p.n; CUT.amount=p.amount;
    var box=$("cutSum"); box.textContent="";
    var b=document.createElement("b"); b.textContent="บิลวันที่ "+p.label; box.appendChild(b);
    box.appendChild(document.createTextNode("\nตัด "+p.n+" บิล · "+bahtFmt(p.amount)+" บาท (เฉพาะที่อนุมัติแล้ว)"
      +(p.unapproved>0 ? "\nยังไม่อนุมัติ "+p.unapproved+" บิล · "+bahtFmt(p.unapproved_amount)+" บาท — ไม่ตัด" : "")
      +(p.held>0 ? "\nกักไว้ "+p.held+" บิล (รอบก่อนผลไม่แน่นอน ต้องให้คนตรวจ ACC) — ไม่ตัด" : "")));
    if(p.busy){ $("cutWarn").textContent="มีคำสั่งตัดที่ยังไม่จบอยู่ — รอให้เสร็จก่อนค่ะ"; return; }
    if(p.offline){ $("cutWarn").textContent="คอมร้านปิดอยู่ (ไม่มีสัญญาณเกิน 10 นาที) — ตัดไม่ได้ตอนนี้ เปิดคอมร้านและ ACC แล้วสั่งใหม่"; return; }
    if(!(p.n>0)){ $("cutWarn").textContent="ไม่มีบิลที่อนุมัติแล้วรอตัดของวันนี้"; return; }
    $("cutWarn").textContent="กดแล้วคอมร้านจะเริ่มตัดภายใน ~2 นาที และคุมเมาส์/คีย์บอร์ดเอง — มีคนแตะเครื่อง = หยุด";
    $("cutOk").disabled=false;
  }catch(e){ console.warn("cutpreview",e); if(g===GEN && CUT) $("cutSum").textContent="เชื่อมต่อไม่ได้ ลองใหม่"; }
}
async function confirmCut(){
  var c=CUT; if(!c || !sb || c.g!==GEN || !(c.n>0)) return;
  $("cutOk").disabled=true; $("cutMsg").textContent="กำลังส่งคำสั่ง…";
  try{
    var r=await sb.rpc("hq_cut_request",{p_date:c.date,p_n:c.n,p_amount:c.amount,p_client:c.client});
    if(c.g!==GEN || CUT!==c) return;
    if(authErr(r.error)){ showGate("สิทธิ์หมดอายุ ใส่ PIN ใหม่"); return; }
    if(r.error){ $("cutMsg").textContent=r.error.code==="P0001" ? String(r.error.message||"").replace(/^hq_cut:\s*/,"") : "ส่งไม่สำเร็จ ลองกดอีกครั้ง (ไม่ซ้ำ)"; $("cutOk").disabled=!!(r.error.code==="P0001"); return; }
    $("msg").value=""; SEND_CLIENT=null; SEND_FOR=""; growMsg(); syncSend();
    closeCut(); await load();
  }catch(e){ console.warn("cutrequest",e); if(c.g===GEN && CUT===c){ $("cutMsg").textContent="เชื่อมต่อไม่ได้ ลองกดอีกครั้ง (ไม่ซ้ำ)"; $("cutOk").disabled=false; } }
}

      try{
        var r=await sb.rpc("hq_push_rebind",{p_endpoint:sub.endpoint});
        if(!r.error && r.data){ setMyDevId(r.data); bound=true; }
        else if(!r.error){ setMyDevId(""); }
      }catch(e){ console.warn("push rebind",e); }
    }
    show=!bound;
  }
  $("bellDot").classList.toggle("hide",!show);
  return bound;
}

async function openNotify(){ $("notify").classList.remove("hide"); nMsg(""); await renderNotify(); }
function closeNotify(){ $("notify").classList.add("hide"); }
async function renderNotify(){
  $("nBody").innerHTML="";
  if(!PUSH_READY){ nText("ระบบเด้งเตือนยังไม่เปิดใช้"); }
  else if(!pushSupported()){
    if(isIOS() && !isStandalone()) nText("iPhone เด้งเตือนได้เมื่อเปิดจากไอคอนหน้าโฮมเท่านั้น: กดปุ่มแชร์ (สี่เหลี่ยมมีลูกศรขึ้น) → \"เพิ่มไปยังหน้าจอโฮม\" → เปิดไอคอน \"HQ แชท\" แล้วใส่ PIN อีกครั้ง จากนั้นกดกระดิ่งนี้");
    else nText("เบราว์เซอร์นี้ไม่รองรับการเด้งเตือน");
  } else if(Notification.permission==="denied"){
    nText("เครื่องนี้ปิดการแจ้งเตือนของ HQ แชทไว้ · เปิดได้ที่ ตั้งค่า → การแจ้งเตือน → HQ แชท");
  } else if(await refreshBell()){
    nText("เครื่องนี้รับเตือนอยู่ · คำเตือนบอกแค่หัวข้อ ไม่มียอดเงิน กดแล้วเปิดแชท");
    nButton("ส่งทดสอบ",true,sendTest);
    nButton("ปิดเตือนเครื่องนี้",false,disablePush);
  } else {
    nText("เปิดแล้ว ผู้ช่วยโพสต์รายงานเมื่อไหร่ เครื่องนี้จะเด้งเตือน (บอกแค่หัวข้อ ไม่มียอดเงิน)");
    nButton("เปิดเตือนเครื่องนี้",true,enablePush);
  }
  await renderDevices();
}
async function enablePush(){
  if(!(await stillOwner())) return;
  var perm=await Notification.requestPermission();
  if(perm!=="granted"){ nMsg("ไม่ได้อนุญาตการแจ้งเตือน",true); return renderNotify(); }
  var reg=await readyReg();
  var sub=await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
  var j=sub.toJSON();
  var r=await sb.rpc("hq_push_register",{p_endpoint:j.endpoint,p_p256dh:j.keys&&j.keys.p256dh,p_auth:j.keys&&j.keys.auth,p_label:deviceLabel()});
  if(r.error){
    try{ await sub.unsubscribe(); }catch(e){}
    nMsg(r.error.code==="42501"?"สิทธิ์หมดอายุ ใส่ PIN ใหม่":(r.error.code==="P0001"?String(r.error.message||"").replace(/^hq_push:\s*/,""):"ลงทะเบียนไม่สำเร็จ ลองใหม่"),true);
    return renderNotify();
  }
  setMyDevId(r.data);
  await renderNotify();
  nMsg("เปิดเตือนแล้ว ลองกด \"ส่งทดสอบ\"");
}
async function disablePush(){
  var sub=await currentSub(), id=myDevId();
  if(id) await sb.rpc("hq_push_unregister",{p_id:Number(id)});
  if(sub){ try{ await sub.unsubscribe(); }catch(e){} }
  setMyDevId("");
  await renderNotify();
  nMsg("ปิดเตือนเครื่องนี้แล้ว");
}
async function sendTest(){
  var r=await sb.rpc("hq_push_test");
  if(r.error) nMsg(r.error.code==="P0001"?String(r.error.message||"").replace(/^hq_push:\s*/,""):"ส่งทดสอบไม่สำเร็จ",true);
  else if(r.data===false) nMsg("เข้าคิวแล้ว แต่ระบบเตือนยังปิดสวิตช์อยู่ (รอห้อง Code เปิด)");
  else nMsg("ส่งแล้ว รอสักครู่ — ถ้าไม่เด้งใน 1 นาที บอกห้อง Code");
}
async function renderDevices(){
  var box=$("nDevs"); box.innerHTML="";
  if(!sb || !READY) return;
  var q=await sb.from("hq_push_devices").select("id,label,created_at,last_ok_at").order("id");
  if(q.error || !q.data || !q.data.length) return;
  var h=document.createElement("p"); h.className="ntxt"; h.textContent="เครื่องที่รับเตือน ("+q.data.length+")"; box.appendChild(h);
  var mine=myDevId();
  q.data.forEach(function(d){
    var row=document.createElement("div"); row.className="dev";
    var t=document.createElement("div"); t.textContent=(d.label||"เครื่องไม่ระบุชื่อ")+(String(d.id)===mine?" (เครื่องนี้)":"");
    var s=document.createElement("span"); s.textContent=d.last_ok_at?" · ส่งถึงล่าสุด "+hhmm(new Date(d.last_ok_at)):" · ยังไม่เคยส่งถึง"; t.appendChild(s);
    var b=document.createElement("button"); b.className="lnk"; b.textContent="ลบ";
    b.onclick=async function(){
      b.disabled=true;
      var r=await sb.rpc("hq_push_unregister",{p_id:d.id});
      if(!r.error && String(d.id)===mine){ var sub=await currentSub(); if(sub){ try{ await sub.unsubscribe(); }catch(e){} } setMyDevId(""); }
      await renderNotify();
    };
    row.appendChild(t); row.appendChild(b); box.appendChild(row);
  });
}

/* ---------- เริ่ม: มี session เดิมที่ยังใช้ได้ → เข้าเลย (บทบาทอ่านจากฐาน) ---------- */
(async function(){
  /* ดูตัวอย่างในเครื่อง: ใช้ไฟล์ข้อมูลในเครื่อง (ไฟล์นี้ไม่ขึ้นเว็บจริง) */
  if(PREVIEW){
    try{ var p=await (await fetch("preview-data.json",{cache:"no-store"})).json();
      try{ TASKS=await (await fetch("preview-tasks.json",{cache:"no-store"})).json(); }catch(_e){}
      $("gate").classList.add("hide"); $("app").removeAttribute("aria-hidden"); $("app").inert=false; render(p);
      try{ showPins(await (await fetch("preview-pins.json",{cache:"no-store"})).json()); }catch(_e){}
      return; }catch(e){ console.warn(e); }
  }
  if(!sb || !window.RevAuth){ $("pinErr").textContent="เชื่อมต่อฐานข้อมูลไม่ได้ ลองรีเฟรชหน้า"; return; }
  var r=await RevAuth.currentRole(sb);
  if(r) useRole(r); else $("pinInput").focus();
})();
